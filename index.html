<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#172033;background:var(--bg,linear-gradient(135deg,#eef2ff,#f8fafc));transition:.25s}button,input,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.app{width:min(1160px,100%);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.icon{width:45px;height:45px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-size:22px}.brand h1{margin:0;font-size:21px}.brand small,.muted{color:#718096}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.btn{border:1px solid #e6eaf0;background:#fff;color:#172033;border-radius:12px;padding:10px 13px;min-height:40px}.btn.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}.btn.danger{background:#fee2e2;color:#dc2626;border-color:#fecaca}.btn.active{background:#dcfce7;color:#166534;border-color:#86efac}.card{background:rgba(255,255,255,.96);border-radius:20px;box-shadow:0 14px 38px rgba(15,23,42,.08)}.setup{max-width:540px;margin:8vh auto;padding:28px}.setup h2{margin:0 0 8px}.setup p{line-height:1.7;color:#718096}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #e6eaf0;border-radius:12px;background:#fff;outline:none}.setupActions{display:grid;gap:8px;margin-top:14px}.hero{padding:18px;margin-bottom:14px}.heroRow{display:flex;justify-content:space-between;gap:10px}.hero h2{margin:0;font-size:24px}.clock{font-size:25px;font-weight:800;text-align:right}.next{font-size:12px;color:#718096;text-align:right;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{padding:12px;border:1px solid #e6eaf0;border-radius:13px;background:#fff}.statTitle{font-size:12px;color:#718096}.statValue{font-size:18px;font-weight:800;margin-top:4px;word-break:break-word}.grid{display:grid;grid-template-columns:280px 1fr;gap:14px}.side{padding:15px;position:sticky;top:12px}.sideTitle{font-weight:800;margin-bottom:10px}.members{display:grid;gap:8px}.member{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid #e6eaf0;border-radius:12px;padding:9px;background:#fff}.memberName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.done{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.sideButtons{display:grid;gap:8px;margin-top:14px}.timeline{padding:16px}.timelineHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.timelineHead h3{margin:0}.slots{display:grid;gap:10px}.slot{display:grid;grid-template-columns:60px 1fr;gap:8px}.time{font-size:12px;font-weight:800;color:#718096;text-align:right;padding-top:11px}.slotBox{border:1px solid #e6eaf0;border-radius:14px;padding:11px;background:#fff}.slot.current .slotBox{border:2px solid #4f46e5;box-shadow:0 0 0 4px rgba(79,70,229,.08)}.slotTitle{display:flex;justify-content:space-between;gap:8px}.pill{display:inline-flex;margin-top:8px;padding:6px 9px;border-radius:9px;font-size:12px;font-weight:800}.pill.now{background:#e0e7ff;color:#3730a3}.pill.done{background:#dcfce7;color:#166534}.caption{margin-top:8px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.media{margin-top:9px;border-radius:11px;overflow:hidden;background:#111827}.media img,.media video{display:block;width:100%;max-height:500px;object-fit:contain}.modal{position:fixed;inset:0;background:rgba(15,23,42,.56);display:none;align-items:center;justify-content:center;padding:12px;z-index:1000}.modal.show{display:flex}.modalCard{width:min(620px,100%);background:#fff;border-radius:20px;padding:17px;max-height:90vh;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border:1px solid #e6eaf0;border-radius:50%;background:#fff}.mediaBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hidden{display:none}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.themeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.themeOpt{border:2px solid #e6eaf0;background:#fff;border-radius:12px;padding:8px;text-align:left}.themeOpt.selected{border-color:#4f46e5}.swatch{height:48px;border-radius:9px;margin-bottom:6px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2000;display:none;background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;max-width:calc(100vw - 30px);text-align:center}@media(max-width:820px){.grid{grid-template-columns:1fr}.side{position:static}.heroRow{flex-direction:column}.clock,.next{text-align:left}}@media(max-width:580px){.stats{grid-template-columns:1fr 1fr}.mediaBtns{grid-template-columns:1fr 1fr}.themeGrid{grid-template-columns:1fr}.slot{grid-template-columns:52px 1fr}.modalActions{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<section id="setup" class="setup card">
  <div class="icon">⏱️</div><h2>MomentLog</h2>
  <p>真正的多人雲端版：建立房間，朋友用房間碼加入，紀錄即時同步。</p>
  <div class="field"><label>你的暱稱</label><input id="name" maxlength="30" placeholder="例如：小明"></div>
  <div class="field"><label>Log 名稱</label><input id="log" maxlength="60" placeholder="例如：我們的暑假"></div>
  <div class="setupActions"><button id="create" class="btn primary">建立新房間</button></div>
  <hr style="border:0;border-top:1px solid #e6eaf0;margin:18px 0">
  <div class="field"><label>加入房間碼</label><input id="joinCode" maxlength="12" placeholder="例如 ABCD1234"></div>
  <div class="setupActions"><button id="join" class="btn">加入房間</button></div>
  <div id="setupStatus" class="muted" style="font-size:13px;margin-top:10px">正在連線…</div>
</section>
<section id="room" class="hide">
<header class="top"><div class="brand"><div class="icon">⏱️</div><div><h1>MomentLog</h1><small>一起記錄每個時刻</small></div></div><div class="actions"><button id="notify" class="btn">🔕 通知：關閉</button><button id="theme" class="btn">🎨 主題</button><button id="invite" class="btn">邀請</button><button id="leave" class="btn danger">離開房間</button></div></header>
<section class="hero card"><div class="heroRow"><div><h2 id="title">MomentLog</h2><div id="sub" class="muted"></div></div><div><div id="clock" class="clock">00:00:00</div><div id="next" class="next"></div></div></div><div class="stats"><div class="stat"><div class="statTitle">已到時段</div><div id="available" class="statValue">0</div></div><div class="stat"><div class="statTitle">今日已完成</div><div id="doneCount" class="statValue">0</div></div><div class="stat"><div class="statTitle">房間碼</div><div id="roomCode" class="statValue"></div></div></div></section>
<main class="grid"><aside class="side card"><div class="sideTitle">房間成員</div><div id="members" class="members"></div><div class="sideButtons"><button id="now" class="btn primary">📍 記錄現在</button><button id="yesterday" class="btn">查看昨天</button><button id="today" class="btn hide">↩ 返回今天</button></div></aside><section class="timeline card"><div class="timelineHead"><div><h3>時間軸</h3><div id="dateLabel" class="muted" style="font-size:13px;margin-top:4px"></div></div></div><div id="slots" class="slots"></div></section></main>
</section></div>
<div id="recordModal" class="modal"><div class="modalCard"><div class="modalHead"><div><h3>記錄這個時刻</h3><div id="recordWhen" class="muted"></div></div><button id="recordClose" class="close">×</button></div><div class="field"><label>內容</label><textarea id="caption" maxlength="3000" rows="6" placeholder="寫下這一刻發生了什麼…"></textarea></div><div class="mediaBtns"><button id="photo" class="btn">📷 拍照</button><button id="video" class="btn">🎥 錄影</button><button id="album" class="btn">🖼️ 相簿</button><button id="remove" class="btn danger">🗑️ 移除</button></div><input id="photoInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="videoInput" class="hidden" type="file" accept="video/*" capture="environment"><input id="albumInput" class="hidden" type="file" accept="image/*,video/*"><div id="preview"></div><div class="modalActions"><button id="cancelRecord" class="btn">取消</button><button id="saveRecord" class="btn primary">儲存</button></div></div></div>
<div id="themeModal" class="modal"><div class="modalCard"><div class="modalHead"><h3>🎨 背景主題</h3><button id="themeClose" class="close">×</button></div><div class="themeGrid"><button class="themeOpt" data-theme="default"><div class="swatch" style="background:linear-gradient(135deg,#eef2ff,#f8fafc)"></div>🌤️ 預設</button><button class="themeOpt" data-theme="blue"><div class="swatch" style="background:linear-gradient(135deg,#dbeafe,#eff6ff)"></div>🌊 藍色</button><button class="themeOpt" data-theme="green"><div class="swatch" style="background:linear-gradient(135deg,#dcfce7,#f0fdf4)"></div>🌿 綠色</button><button class="themeOpt" data-theme="pink"><div class="swatch" style="background:linear-gradient(135deg,#fce7f3,#fff1f2)"></div>🌸 粉色</button><button class="themeOpt" data-theme="purple"><div class="swatch" style="background:linear-gradient(135deg,#ede9fe,#f5f3ff)"></div>💜 紫色</button><button class="themeOpt" data-theme="sunset"><div class="swatch" style="background:linear-gradient(135deg,#ffedd5,#fef3c7)"></div>🌅 日落</button></div></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, onValue, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
import { getMessaging, getToken, isSupported, onMessage } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-messaging.js";
import firebaseConfig from "./firebase-config.js";

const VAPID_PUBLIC_KEY = "YOUR_VAPID_PUBLIC_KEY";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);
const $ = id => document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const taipeiParts = date => new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(date).reduce((o,p)=>(o[p.type]=p.value,o),{});
const dateKey = d => {const p=taipeiParts(d);return `${p.year}-${p.month}-${p.day}`};
const hourKey = h => pad(h);
const isToday = d => dateKey(d)===dateKey(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const escapeHtml = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const safeFileName = n => String(n||"file").replace(/[^a-zA-Z0-9._-]/g,"_").slice(0,120);
let user=null, roomId=localStorage.getItem("momentlog_room")||"", room=null, selectedFile=null, activeHour=null, currentDate=new Date(), unsubs=[];
const themes={default:"linear-gradient(135deg,#eef2ff,#f8fafc)",blue:"linear-gradient(135deg,#dbeafe,#eff6ff)",green:"linear-gradient(135deg,#dcfce7,#f0fdf4)",pink:"linear-gradient(135deg,#fce7f3,#fff1f2)",purple:"linear-gradient(135deg,#ede9fe,#f5f3ff)",sunset:"linear-gradient(135deg,#ffedd5,#fef3c7)"};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(window.__t);window.__t=setTimeout(()=>t.style.display="none",2300)}
function applyTheme(){const t=localStorage.getItem("momentlog_theme")||"default";document.documentElement.style.setProperty("--bg",themes[t]||themes.default);document.querySelectorAll(".themeOpt").forEach(b=>b.classList.toggle("selected",b.dataset.theme===t))}
function showSetupStatus(m){$("setupStatus").textContent=m}
function memberPath(uid){return `rooms/${roomId}/members/${uid}`}
function recordPath(d,h,uid){return `rooms/${roomId}/records/${dateKey(d)}/${hourKey(h)}/${uid}`}
function renderNotify(){const enabled=room?.notificationSettings?.[user?.uid]?.enabled===true;const b=$("notify");b.textContent=enabled?"🔔 通知：開啟":"🔕 通知：關閉";b.classList.toggle("active",enabled)}
async function ensureAuth(){if(auth.currentUser)return auth.currentUser;await signInAnonymously(auth);return auth.currentUser}
async function createRoom(){try{const u=await ensureAuth();const name=$("name").value.trim()||"我";const log=$("log").value.trim()||"我們的 Log";let id="";for(let i=0;i<8;i++){const candidate=crypto.randomUUID().replace(/-/g,"").slice(0,8).toUpperCase();const tx=await runTransaction(ref(db,`rooms/${candidate}/meta`),cur=>cur===null?{roomId:candidate,name:log,ownerUid:u.uid,createdAt:Date.now()}:undefined);if(tx.committed){id=candidate;break}}if(!id)throw new Error("房間碼建立失敗");await set(ref(db,memberPathFor(id,u.uid)),{displayName:name,joinedAt:Date.now(),updatedAt:Date.now()});localStorage.setItem("momentlog_room",id);localStorage.setItem("momentlog_name",name);roomId=id;connectRoom();toast("房間建立成功")}catch(e){console.error(e);toast("建立房間失敗："+e.message)}}
function memberPathFor(id,uid){return `rooms/${id}/members/${uid}`}
async function joinRoom(){try{const u=await ensureAuth();const id=$("joinCode").value.trim().toUpperCase();if(!/^[A-Z0-9]{8,12}$/.test(id)){toast("房間碼格式不正確");return}const meta=await get(ref(db,`rooms/${id}/meta`));if(!meta.exists()){toast("找不到這個房間");return}const name=$("name").value.trim()||"朋友";await set(ref(db,memberPathFor(id,u.uid)),{displayName:name,joinedAt:Date.now(),updatedAt:Date.now()});localStorage.setItem("momentlog_room",id);localStorage.setItem("momentlog_name",name);roomId=id;connectRoom();toast("已加入房間")}catch(e){console.error(e);toast("加入房間失敗")}}
function clearListeners(){unsubs.forEach(fn=>fn&&fn());unsubs=[]}
function connectRoom(){clearListeners();if(!roomId||!user)return;const membersR=ref(db,`rooms/${roomId}/members`);const settingsR=ref(db,`rooms/${roomId}/notificationSettings`);const metaR=ref(db,`rooms/${roomId}/meta`);const offMeta=onValue(metaR,s=>{if(!s.exists()){toast("房間不存在");leaveLocal();return}room=room||{};room.meta=s.val();render()});const offMembers=onValue(membersR,s=>{room=room||{};room.members=s.val()||{};render()});const offSettings=onValue(settingsR,s=>{room=room||{};room.notificationSettings=s.val()||{};render()});unsubs.push(offMeta,offMembers,offSettings);loadRecordsListener()}
let offRecords=null;function loadRecordsListener(){if(offRecords)offRecords();const r=ref(db,`rooms/${roomId}/records/${dateKey(currentDate)}`);offRecords=onValue(r,s=>{room=room||{};room.records=s.val()||{};render();});unsubs.push(()=>{if(offRecords)offRecords()})}
async function render(){if(!room?.meta)return;$("setup").classList.add("hide");$("room").classList.remove("hide");$("title").textContent=room.meta.name||"MomentLog";$("roomCode").textContent=roomId;$("sub").textContent=`${dateKey(currentDate)} · 房間碼 ${roomId}`;const p=taipeiParts(new Date());$("clock").textContent=`${p.hour}:${p.minute}:${p.second}`;const max=isToday(currentDate)?Number(p.hour):23;let all=room.records||{};let entries=[];for(let h=0;h<=max;h++)entries.push([h,all[hourKey(h)]||{}]);const done=entries.reduce((n,[,v])=>n+(v[user.uid]?1:0),0);$("available").textContent=String(entries.length);$("doneCount").textContent=String(done);$("dateLabel").textContent=isToday(currentDate)?"今天":`歷史日期：${dateKey(currentDate)}`;$("yesterday").classList.toggle("hide",!isToday(currentDate));$("today").classList.toggle("hide",isToday(currentDate));renderMembers();renderTimeline(entries,max);renderNotify();applyTheme()}
function renderMembers(){const members=room.members||{};const entries=room.records||{};$("members").innerHTML=Object.entries(members).map(([uid,m])=>{const done=Object.keys(entries).some(h=>entries[h]?.[uid]);return `<div class="member"><span class="memberName">👤 ${escapeHtml(m.displayName||"未命名")}</span><span class="badge ${done?"done":"wait"}">${done?"已完成":"等待中"}</span></div>`}).join("")||"<div class='muted'>沒有成員</div>"}
function renderTimeline(entries,max){const p=taipeiParts(new Date());const arr=entries.map(([h,users])=>{const mine=users?.[user.uid]||null;const current=isToday(currentDate)&&h===Number(p.hour);const media=mine?.media?.downloadURL?((mine.media.contentType||"").startsWith("image/")?`<div class="media"><img src="${escapeHtml(mine.media.downloadURL)}" alt="圖片"></div>`:`<div class="media"><video src="${escapeHtml(mine.media.downloadURL)}" controls playsinline></video></div>`):"";return `<div class="slot ${current?"current":""}"><div class="time">${pad(h)}:00</div><div class="slotBox"><div class="slotTitle"><b>${mine?"📌 已記錄":current?"⏰ 現在":"尚未紀錄"}</b><span class="muted">${current?"現在":""}</span></div>${mine?`<div class="pill done">✅ 你已完成</div>`:current?`<div class="pill now">🔔 現在要記錄</div>`:""}${mine?.text?`<div class="caption">${escapeHtml(mine.text)}</div>`:""}${media}<div style="margin-top:9px"><button class="btn ${mine||current?"primary":""}" data-hour="${h}">${mine?"編輯紀錄":current?"🔔 記錄現在":"立即紀錄"}</button></div></div></div>`});$("slots").innerHTML=arr.join("");document.querySelectorAll("[data-hour]").forEach(b=>b.onclick=()=>openRecord(Number(b.dataset.hour)))}
function openRecord(h){activeHour=h;selectedFile=null;const mine=room?.records?.[hourKey(h)]?.[user.uid]||null;$("recordWhen").textContent=`${dateKey(currentDate)} · ${pad(h)}:00`;$("caption").value=mine?.text||"";renderPreview(mine?.media?.downloadURL,mine?.media?.contentType);$("recordModal").classList.add("show")}
function closeRecord(){$("recordModal").classList.remove("show");selectedFile=null;activeHour=null;$("preview").innerHTML=""}
function renderPreview(url,type,fileUrl){const src=fileUrl||url;if(!src){$("preview").innerHTML="";return}$("preview").innerHTML=(type||"").startsWith("image/")?`<div class="media"><img src="${escapeHtml(src)}"></div>`:`<div class="media"><video src="${escapeHtml(src)}" controls playsinline></video></div>`}
function chooseFile(f){if(!f)return;if(!/^(image|video)\//.test(f.type)){toast("只支援圖片或影片");return}if(f.size>250*1024*1024){toast("單檔不能超過 250MB");return}selectedFile=f;renderPreview("",f.type,URL.createObjectURL(f))}
async function saveRecord(){if(activeHour===null)return;const path=recordPath(currentDate,activeHour,user.uid);const old=room?.records?.[hourKey(activeHour)]?.[user.uid]||null;let media=old?.media||null;try{if(selectedFile){const storagePath=`room-media/${roomId}/${user.uid}/${dateKey(currentDate)}_${pad(activeHour)}/${crypto.randomUUID()}-${safeFileName(selectedFile.name)}`;const sr=storageRef(storage,storagePath);await uploadBytes(sr,selectedFile,{contentType:selectedFile.type});const url=await getDownloadURL(sr);media={storagePath,downloadURL:url,contentType:selectedFile.type,name:selectedFile.name,size:selectedFile.size}}const text=$("caption").value.trim();await set(ref(db,path),{date:dateKey(currentDate),hour:activeHour,text,authorUid:user.uid,authorName:localStorage.getItem("momentlog_name")||"我",savedAt:old?.savedAt||Date.now(),updatedAt:Date.now(),media:media||null});if(old?.media?.storagePath&&selectedFile&&old.media.storagePath!==media?.storagePath){deleteObject(storageRef(storage,old.media.storagePath)).catch(()=>{})}closeRecord();toast("已同步到雲端")}catch(e){console.error(e);toast("儲存失敗："+e.message)}}
async function removeMedia(){const old=room?.records?.[hourKey(activeHour)]?.[user.uid]||null;try{if(old?.media?.storagePath)await deleteObject(storageRef(storage,old.media.storagePath));const text=$("caption").value.trim();await set(ref(db,recordPath(currentDate,activeHour,user.uid)),{date:dateKey(currentDate),hour:activeHour,text,authorUid:user.uid,authorName:localStorage.getItem("momentlog_name")||"我",savedAt:old?.savedAt||Date.now(),updatedAt:Date.now(),media:null});selectedFile=null;$("preview").innerHTML="";toast("媒體已移除")}catch(e){toast("移除失敗")}}
async function toggleNotification(){try{const current=room?.notificationSettings?.[user.uid]?.enabled===true;if(current){await update(ref(db,`rooms/${roomId}/notificationSettings/${user.uid}`),{enabled:false,updatedAt:Date.now()});toast("提醒已關閉");return}if(!(await isSupported())){toast("這個瀏覽器不支援背景推播");return}if(Notification.permission==="denied"){toast("請到瀏覽器網站設定允許通知");return}if(Notification.permission==="default"){const p=await Notification.requestPermission();if(p!=="granted"){toast("沒有允許通知");return}}const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");const messaging=getMessaging(app);const token=await getToken(messaging,{vapidKey:VAPID_PUBLIC_KEY,serviceWorkerRegistration:reg});if(!token)throw new Error("無法取得推播 token");const key=btoa(token).replace(/[^a-zA-Z0-9_-]/g,"_");await set(ref(db,`fcmTokens/${user.uid}/${key}`),{token,createdAt:Date.now(),updatedAt:Date.now(),userAgent:navigator.userAgent});await update(ref(db,`rooms/${roomId}/notificationSettings/${user.uid}`),{enabled:true,timezone:"Asia/Taipei",updatedAt:Date.now()});toast("提醒已開啟")}catch(e){console.error(e);toast("通知設定失敗："+e.message)}}
async function invite(){const text=`加入 MomentLog「${room.meta.name}」\n房間碼：${roomId}`;try{await navigator.clipboard.writeText(text);toast("邀請資訊已複製")}catch{prompt("複製邀請資訊",text)}}
async function leaveRoom(){if(!confirm("確定要離開這個房間嗎？"))return;try{await remove(ref(db,memberPath(user.uid)));await remove(ref(db,`rooms/${roomId}/notificationSettings/${user.uid}`));leaveLocal();toast("已離開房間")}catch{toast("離開房間失敗")}}
function leaveLocal(){clearListeners();room=null;localStorage.removeItem("momentlog_room");roomId="";$("room").classList.add("hide");$("setup").classList.remove("hide")}
function showYesterday(){currentDate=addDays(new Date(),-1);loadRecordsListener();render()}
function showToday(){currentDate=new Date();loadRecordsListener();render()}
function tick(){const p=taipeiParts(new Date());$("clock").textContent=`${p.hour}:${p.minute}:${p.second}`;if(isToday(currentDate)){const next=new Date(Date.now()+3600000);const np=taipeiParts(next);$("next").textContent=`下一個紀錄點 ${np.hour}:00`}else $("next").textContent="正在查看歷史紀錄";if(isToday(currentDate)&&Number(p.minute)===0&&Number(p.second)<2)render()}
function onPageMessage(){isSupported().then(ok=>{if(ok){try{onMessage(getMessaging(app),payload=>toast(payload.notification?.body||payload.data?.body||"該記錄了！"))}catch{}}})}
$("create").onclick=createRoom;$("join").onclick=joinRoom;$("notify").onclick=toggleNotification;$("invite").onclick=invite;$("leave").onclick=leaveRoom;$("now").onclick=()=>{currentDate=new Date();loadRecordsListener();openRecord(Number(taipeiParts(new Date()).hour))};$("yesterday").onclick=showYesterday;$("today").onclick=showToday;$("recordClose").onclick=closeRecord;$("cancelRecord").onclick=closeRecord;$("saveRecord").onclick=saveRecord;$("remove").onclick=removeMedia;$("photo").onclick=()=>$("photoInput").click();$("video").onclick=()=>$("videoInput").click();$("album").onclick=()=>$("albumInput").click();$("photoInput").onchange=e=>{chooseFile(e.target.files?.[0]);e.target.value=""};$("videoInput").onchange=e=>{chooseFile(e.target.files?.[0]);e.target.value=""};$("albumInput").onchange=e=>{chooseFile(e.target.files?.[0]);e.target.value=""};$("theme").onclick=()=>$("themeModal").classList.add("show");$("themeClose").onclick=()=>$("themeModal").classList.remove("show");document.querySelectorAll(".themeOpt").forEach(b=>b.onclick=()=>{localStorage.setItem("momentlog_theme",b.dataset.theme);applyTheme();$("themeModal").classList.remove("show")});$("recordModal").onclick=e=>{if(e.target===$("recordModal"))closeRecord()};$("themeModal").onclick=e=>{if(e.target===$("themeModal"))$("themeModal").classList.remove("show")};window.addEventListener("beforeunload",clearListeners);applyTheme();setInterval(tick,1000);onPageMessage();onAuthStateChanged(auth,u=>{user=u;if(u){$("setupStatus").textContent="已連線 Firebase";if(roomId)connectRoom()}});ensureAuth().catch(e=>showSetupStatus("Firebase 連線失敗：請確認 config 與 Anonymous Auth"));
</script>
</body>
</html>
